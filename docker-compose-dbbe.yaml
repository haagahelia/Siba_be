name: dbbe_project

services:
  siba_db_service:
    image: mariadb:12 # OR: e.g. mariadb:latest OR  mariadb:12.2.2-ubi10
    container_name: siba_db_container
    env_file: .env
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./Database/SQL_Scripts/000__CreateALLdb.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_be_network

  siba_be_service:
    container_name: siba_be_container
    build: .
    env_file: .env
    depends_on:
      siba_db_service:
        condition: service_healthy
    environment:
      - DB_HOST=siba_db_service
    ports:
      - "${BE_SERVER_PORT}:${BE_SERVER_PORT}"
    volumes:
      - .:/app
      - temp_node_module_volume:/app/node_modules
    networks:
      - db_be_network

networks:
  db_be_network:
    driver: bridge

volumes:
  mariadb_data:
  temp_node_module_volume:
